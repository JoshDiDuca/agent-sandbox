name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    # Windows runners have ConPTY and the .NET Framework compiler, so the live ptyhost/daemon tests run too.
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
