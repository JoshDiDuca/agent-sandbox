name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci   # also builds (prepare)
      - name: Self-test (informational)
        # The live tests drive ConPTY, csc.exe and real file links; hosted runners differ from a real Windows
        # desktop, so a failure here is reported but does not fail the build.
        continue-on-error: true
        run: node dist/bin/sandbox.js self-test
      - name: Check install.ps1 parses in Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Package
        run: npm pack --silent
      - uses: actions/upload-artifact@v4
        with:
          name: windows-development-sandbox-package
          path: windows-development-sandbox-*.tgz
