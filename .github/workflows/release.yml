name: Release

# Push a version tag (npm run release:patch does it for you). This builds, packs and publishes:
#  - a GitHub Release with agent-sandbox-x.y.z.tgz and agent-sandbox.tgz, so this always installs the newest one:
#      npm install -g https://github.com/<owner>/<repo>/releases/latest/download/agent-sandbox.tgz
#  - a GitHub Package (npm.pkg.github.com) named @<owner>/agent-sandbox
#  - npm (registry.npmjs.org) too, if the repository has an NPM_TOKEN secret
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci   # also builds (prepare)
      - name: Self-test (informational)
        continue-on-error: true
        run: node dist/bin/agent-sandbox.js self-test
      - name: Check the tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $version" }
      - name: Pack
        id: pack
        shell: pwsh
        run: |
          npm pack --silent | Out-Null
          $file = (Get-ChildItem agent-sandbox-*.tgz | Select-Object -First 1).Name
          Copy-Item $file agent-sandbox.tgz
          "file=$file" >> $env:GITHUB_OUTPUT
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pack.outputs.file }}
            agent-sandbox.tgz
          generate_release_notes: true
          body: |
            Install or update:
            ```
            npm install -g https://github.com/${{ github.repository }}/releases/latest/download/agent-sandbox.tgz
            ```
      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Packages only accepts names scoped to the repository owner (lower-case).
          $scope = '${{ github.repository_owner }}'.ToLower()
          npm pkg set "name=@$scope/agent-sandbox" "publishConfig.registry=https://npm.pkg.github.com" "repository.url=https://github.com/${{ github.repository }}.git"
          "@${scope}:registry=https://npm.pkg.github.com`n//npm.pkg.github.com/:_authToken=`${NODE_AUTH_TOKEN}" | Set-Content .npmrc
          npm publish --ignore-scripts
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: pwsh
        run: |
          "//registry.npmjs.org/:_authToken=`${NODE_AUTH_TOKEN}" | Add-Content .npmrc
          npm publish ${{ steps.pack.outputs.file }} --provenance --access public --registry https://registry.npmjs.org
