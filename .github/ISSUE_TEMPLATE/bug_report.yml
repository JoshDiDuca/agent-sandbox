name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, do not use this form: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got. Paste the full error.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `sandbox doctor`
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: From `npm ls -g windows-development-sandbox`
  - type: input
    id: windows
    attributes:
      label: Windows edition and build
      placeholder: Windows 11 Pro 23H2
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything useful from `sandbox logs`. Remove secrets first.
      render: text
